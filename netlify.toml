[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# O service worker tem de ser servido sempre fresco, senão o telemóvel pode
# ficar preso a uma versão antiga durante horas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Single-page app: qualquer rota devolve o index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
